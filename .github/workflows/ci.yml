name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend - build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: isp_billing_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (catches TypeScript errors)
        run: npm run build

      - name: Run unit tests
        run: npm run test

      - name: Run database migration (test db)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: isp_billing_test
        run: npm run migration:run

      - name: Run e2e tests
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: isp_billing_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret
          JWT_EXPIRES_IN: 15m
          MIDTRANS_SERVER_KEY: SB-Mid-server-ci-test-key
          MIDTRANS_IS_PRODUCTION: "false"
          XENDIT_SECRET_KEY: xnd_ci_test
          XENDIT_WEBHOOK_TOKEN: ci-test-token
          WA_API_BASE_URL: https://graph.facebook.com/v20.0
          WA_PHONE_NUMBER_ID: ci-test
          WA_ACCESS_TOKEN: ci-test
        run: |
          cat > .env.test << EOF
          NODE_ENV=test
          DB_HOST=localhost
          DB_PORT=5432
          DB_USERNAME=postgres
          DB_PASSWORD=postgres
          DB_NAME=isp_billing_test
          REDIS_HOST=localhost
          REDIS_PORT=6379
          JWT_SECRET=ci-test-secret
          JWT_EXPIRES_IN=15m
          MIDTRANS_SERVER_KEY=SB-Mid-server-ci-test-key
          MIDTRANS_IS_PRODUCTION=false
          XENDIT_SECRET_KEY=xnd_ci_test
          XENDIT_WEBHOOK_TOKEN=ci-test-token
          WA_API_BASE_URL=https://graph.facebook.com/v20.0
          WA_PHONE_NUMBER_ID=ci-test
          WA_ACCESS_TOKEN=ci-test
          INVOICE_REMINDER_DAYS_BEFORE=3,1
          ISOLIR_GRACE_DAYS=3
          EOF
          npm run test:e2e

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1
